          type: boolean
        id:
          type: string
        ip_address:
          type:
            - string
            - "null"
        user_agent:
          type: string
      required:
        - id
        - user_agent
        - ip_address
        - created_at
        - current
      type: object
    SignedRecord:
      additionalProperties: false
      properties:
        record:
          description: Canonical binary record in unpadded base64url.
          maxLength: 88780
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        signature:
          description: Detached Ed25519 signature in unpadded base64url.
          maxLength: 86
          minLength: 86
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      required:
        - record
        - signature
      type: object
    Tag:
      additionalProperties: false
      properties:
        color:
          pattern: ^#[0-9A-F]{6}$
          type: string
        created_at:
          format: date-time
          type: string
        encrypted_color:
          contentEncoding: base64
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        id:
          type: string
        library_id:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - created_at
        - updated_at
      type: object
    TagBody:
      additionalProperties: false
      properties:
        color:
          maxLength: 7
          type: string
        encrypted_color:
          contentEncoding: base64
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        name:
          maxLength: 100
          type: string
        name_token:
          contentEncoding: base64
          type: string
      type: object
    TrashPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/TrashedFile"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    TrashedFile:
      additionalProperties: false
      properties:
        delete_after:
          format: date-time
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        id:
          type: string
        library_id:
          type: string
        library_name:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          type: string
        revision:
          format: int64
          type: integer
        trashed_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - library_name
        - parent_id
        - revision
        - trashed_at
        - delete_after
        - encryption_mode
      type: object
    UpdateAccountInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - email
      type: object
    UpdateBackendInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        name:
          maxLength: 100
          minLength: 1
          type: string
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
      required:
        - name
        - enabled
      type: object
    UpdateInputBody:
      additionalProperties: false
      properties:
        password_envelope:
          $ref: "#/components/schemas/SignedRecord"
        private_envelope:
          $ref: "#/components/schemas/SignedRecord"
        recovery_envelope:
          $ref: "#/components/schemas/SignedRecord"
      type: object
    UpdateUserQuotaInputBody:
      additionalProperties: false
      properties:
        backend_quotas:
          description: The list replaces all backend overrides. The inherit mode removes an override.
          items:
            $ref: "#/components/schemas/BackendQuota"
          maxItems: 1000
          type: array
        default_quota:
          $ref: "#/components/schemas/Quota"
          description: The inherit mode uses the global default quota.
      required:
        - default_quota
        - backend_quotas
      type: object
    Upload:
      additionalProperties: false
      properties:
        declared_size:
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        failure_code:
          type: string
        failure_message:
          type: string
        id:
          type: string
        node_id:
          type: string
        offset:
          format: int64
          type: integer
        state:
          type: string
        upload_url:
          type: string
        version_id:
          type: string
      required:
        - id
        - state
        - upload_url
        - declared_size
        - offset
        - expires_at
      type: object
    Usage:
      additionalProperties: false
      properties:
        backend:
          $ref: "#/components/schemas/LibraryBackend"
        limit_bytes:
          description: A null value means no limit.
          format: int64
          type:
            - integer
            - "null"
        used_bytes:
          description: Stored bytes of all file versions and trashed files, plus bytes of unfinished uploads.
          format: int64
          type: integer
      required:
        - backend
        - used_bytes
        - limit_bytes
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
      type: object
    VersionOutputBody:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
  securitySchemes:
    session:
      in: cookie
      name: stocat_session
      type: apiKey
