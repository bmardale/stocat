components:
  schemas:
    AdminUser:
      additionalProperties: false
      properties:
        backend_quotas:
          description: A backend without an override uses the default quota of the user.
          items:
            $ref: "#/components/schemas/BackendQuota"
          type: array
        default_quota:
          $ref: "#/components/schemas/Quota"
          description: The inherit mode uses the global default quota.
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
        - default_quota
        - backend_quotas
      type: object
    AuditDetails:
      additionalProperties: false
      properties:
        backend_enabled:
          type: boolean
        backend_quota_count:
          format: int64
          type: integer
        backend_type:
          enum:
            - local
            - s3
          type: string
        destination_library_id:
          type: string
        destination_library_name:
          type: string
        email:
          type: string
        encrypted:
          description: The library encrypts names, so the event contains no file or tag names.
          type: boolean
        library_id:
          type: string
        library_name:
          type: string
        method:
          enum:
            - password
            - passkey
          type: string
        name:
          type: string
        previous_email:
          type: string
        previous_name:
          type: string
        quota_limit_bytes:
          format: int64
          type: integer
        quota_mode:
          enum:
            - inherit
            - unlimited
            - limited
          type: string
        size_bytes:
          format: int64
          type: integer
        tag_id:
          type: string
        tag_name:
          type: string
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          enum:
            - account.registered
            - account.signed_in
            - account.signed_out
            - account.updated
            - account.password_changed
            - account.admin_granted
            - account.admin_revoked
            - session.revoked
            - session.others_revoked
            - passkey.added
            - passkey.renamed
            - passkey.deleted
            - library.created
            - folder.created
            - file.uploaded
            - file.replaced
            - file.renamed
            - file.trashed
            - file.restored
            - file.deleted
            - file.tagged
            - file.untagged
            - tag.created
            - tag.updated
            - tag.deleted
            - replication.created
            - replication.sync_requested
            - replication.deleted
            - storage_backend.created
            - storage_backend.updated
            - storage_backend.deleted
            - quota.user_updated
            - quota.default_updated
          type: string
        actor:
          $ref: "#/components/schemas/AuditUser"
          description: A user actor has no value after the user is deleted.
        actor_type:
          enum:
            - user
            - system
          type: string
        created_at:
          format: date-time
          type: string
        details:
          $ref: "#/components/schemas/AuditDetails"
        id:
          type: string
        ip_address:
          type: string
        request_id:
          type: string
        subject:
          $ref: "#/components/schemas/AuditUser"
          description: The user whose account or data the action affects.
        target_id:
          type: string
        user_agent:
          type: string
      required:
        - id
        - action
        - actor_type
        - details
        - created_at
      type: object
    AuditEventPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AuditUser:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Backend:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        id:
          examples:
            - stb_01K4W9T5V8QK3M7ZB0YHXC2FNE
          type: string
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Present only for local backends.
        name:
          type: string
        s3:
          $ref: "#/components/schemas/S3Config"
          description: Present only for S3 backends. It never contains credentials.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - id
        - name
        - type
        - enabled
      type: object
    BackendQuota:
      additionalProperties: false
      properties:
        backend_id:
          maxLength: 64
          type: string
        limit_bytes:
          description: Send the limit only with the limited mode.
          format: int64
          minimum: 0
          type: integer
        mode:
          enum:
            - inherit
            - unlimited
            - limited
          type: string
      required:
        - backend_id
        - mode
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          description: Use at least 15 characters and at most 1024 bytes.
          type: string
          writeOnly: true
      required:
        - current_password
        - new_password
      type: object
    CheckSettingsInputBody:
      additionalProperties: false
      properties:
        id:
          description: ID of a saved backend. Empty S3 credentials use the stored credentials of this backend, if the endpoint does not change.
          maxLength: 64
          type: string
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - type
      type: object
    CompleteInputBody:
      additionalProperties: false
      properties:
        dedup_fingerprint:
          contentEncoding: base64
          type: string
        encrypted_file_key:
          contentEncoding: base64
          type: string
        encryption_format:
          maxLength: 64
          type: string
      type: object
    ConnectionCheck:
      additionalProperties: false
      properties:
        message:
          description: Result of the check. It never contains credentials.
          type: string
        ok:
          type: boolean
      required:
        - ok
        - message
      type: object
    CreateBackendInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        name:
          maxLength: 100
          minLength: 1
          type: string
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - name
        - type
        - enabled
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        encrypted_name:
          contentEncoding: base64
          type: string
        expected_revision:
          format: int64
          minimum: 0
          type: integer
        library_id:
          maxLength: 64
          type: string
        name:
          maxLength: 255
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          maxLength: 64
          type: string
        size:
          format: int64
          minimum: 0
          type: integer
        target_node_id:
          maxLength: 64
          type: string
      required:
        - library_id
        - size
      type: object
    CreateLibraryInputBody:
      additionalProperties: false
      properties:
        backend_id:
          maxLength: 64
          minLength: 1
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        key_envelope:
          contentEncoding: base64
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - backend_id
        - encryption_mode
      type: object
    CreatePasskeyInputBody:
      additionalProperties: false
      properties:
        credential:
          description: The RegistrationResponseJSON value from PublicKeyCredential.toJSON().
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - credential
      type: object
    CreateReplicationInputBody:
      additionalProperties: false
      properties:
        destination_library_id:
          maxLength: 64
          type: string
        source_library_id:
          maxLength: 64
          type: string
      required:
        - source_library_id
        - destination_library_id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FileDetails:
      additionalProperties: false
      properties:
        content_url:
          type: string
        encrypted_file_key:
          contentEncoding: base64
          type: string
        encryption_format:
          type: string
        id:
          type: string
        library_id:
          type: string
        revision:
          format: int64
          type: integer
        size:
          format: int64
          type: integer
        stored_size:
          format: int64
          type: integer
        version_id:
          type: string
      required:
        - id
        - library_id
        - version_id
        - revision
        - size
        - stored_size
        - content_url
      type: object
    FolderInputBody:
      additionalProperties: false
      properties:
        encrypted_name:
          contentEncoding: base64
          type: string
        name:
          maxLength: 255
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          maxLength: 64
          type: string
      type: object
    Library:
      additionalProperties: false
      properties:
        backend:
          $ref: "#/components/schemas/LibraryBackend"
        created_at:
          format: date-time
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        id:
          type: string
        key_envelope:
          contentEncoding: base64
          type: string
        name:
          type: string
        root_node_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - encryption_mode
        - root_node_id
        - backend
        - created_at
        - updated_at
      type: object
    LibraryBackend:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - id
        - name
        - type
      type: object
    LibraryRef:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    LocalConfig:
      additionalProperties: false
      properties:
        root:
          description: Absolute path of the directory that stores objects.
          examples:
            - /var/lib/stocat/objects
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - root
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - email
        - password
      type: object
    Node:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        id:
          type: string
        kind:
          enum:
            - file
            - folder
          type: string
        library_id:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          type: string
        revision:
          format: int64
          type: integer
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - kind
        - revision
        - created_at
        - updated_at
        - tags
      type: object
    NodesPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Node"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    Passkey:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        synced:
          description: The authenticator backs up the passkey, for example to a cloud account.
          type: boolean
      required:
        - id
        - name
        - created_at
        - last_used_at
        - synced
      type: object
    PasskeyRegistrationOptionsInputBody:
      additionalProperties: false
      properties:
        password:
          type: string
          writeOnly: true
      required:
        - password
      type: object
    ProbeOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    Problem:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        request_id:
          description: Identifier of the request. Give this value to support.
          examples:
            - req_01K4W9T5V8QK3M7ZB0YHXC2FNE
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Quota:
      additionalProperties: false
      properties:
        limit_bytes:
          description: Send the limit only with the limited mode.
          format: int64
          minimum: 0
          type: integer
        mode:
          enum:
            - inherit
            - unlimited
            - limited
          type: string
      required:
        - mode
      type: object
    QuotaSettings:
      additionalProperties: false
      properties:
        default_quota:
          $ref: "#/components/schemas/Quota"
          description: The global default quota. The inherit mode is not allowed.
      required:
        - default_quota
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        password:
          description: Use at least 15 characters and at most 1024 bytes.
          type: string
          writeOnly: true
      required:
        - name
        - email
        - password
      type: object
    RenameInputBody:
      additionalProperties: false
      properties:
        encrypted_name:
          contentEncoding: base64
          type: string
        name:
          maxLength: 255
          type: string
        name_token:
          contentEncoding: base64
          type: string
      type: object
    RenamePasskeyInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    Replication:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        destination:
          $ref: "#/components/schemas/LibraryRef"
        id:
          type: string
        last_error:
          type: string
        last_synced_at:
          format: date-time
          type: string
        source:
          $ref: "#/components/schemas/LibraryRef"
        state:
          enum:
            - pending
            - syncing
            - ready
            - failed
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - source
        - destination
        - state
        - created_at
        - updated_at
      type: object
    S3Config:
      additionalProperties: false
      properties:
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    S3Input:
      additionalProperties: false
      properties:
        access_key_id:
          description: Required when you create a backend. On update, leave both credentials empty to keep the stored credentials.
          maxLength: 256
          type: string
          writeOnly: true
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
        secret_access_key:
          maxLength: 256
          type: string
          writeOnly: true
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    Session:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        current:
          description: The request uses this session.
          type: boolean
        id:
          type: string
        ip_address:
          type:
            - string
            - "null"
        user_agent:
          type: string
      required:
        - id
        - user_agent
        - ip_address
        - created_at
        - current
      type: object
    Tag:
      additionalProperties: false
      properties:
        color:
          pattern: ^#[0-9A-F]{6}$
          type: string
        created_at:
          format: date-time
          type: string
        encrypted_color:
          contentEncoding: base64
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        id:
          type: string
        library_id:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - created_at
        - updated_at
      type: object
    TagBody:
      additionalProperties: false
      properties:
        color:
          maxLength: 7
          type: string
        encrypted_color:
          contentEncoding: base64
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        name:
          maxLength: 100
          type: string
        name_token:
          contentEncoding: base64
          type: string
      type: object
    TrashPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/TrashedFile"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    TrashedFile:
      additionalProperties: false
      properties:
        delete_after:
          format: date-time
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        id:
          type: string
        library_id:
          type: string
        library_name:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          type: string
        revision:
          format: int64
          type: integer
        trashed_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - library_name
        - parent_id
        - revision
        - trashed_at
        - delete_after
        - encryption_mode
      type: object
    UpdateAccountInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - email
      type: object
    UpdateBackendInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        name:
          maxLength: 100
          minLength: 1
          type: string
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
      required:
        - name
        - enabled
      type: object
    UpdateUserQuotaInputBody:
      additionalProperties: false
      properties:
        backend_quotas:
          description: The list replaces all backend overrides. The inherit mode removes an override.
          items:
            $ref: "#/components/schemas/BackendQuota"
          maxItems: 1000
          type: array
        default_quota:
          $ref: "#/components/schemas/Quota"
          description: The inherit mode uses the global default quota.
      required:
        - default_quota
        - backend_quotas
      type: object
    Upload:
      additionalProperties: false
      properties:
        declared_size:
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        failure_code:
          type: string
        failure_message:
          type: string
        id:
          type: string
        node_id:
          type: string
        offset:
          format: int64
          type: integer
        state:
          type: string
        upload_url:
          type: string
        version_id:
          type: string
      required:
        - id
        - state
        - upload_url
        - declared_size
        - offset
        - expires_at
      type: object
    Usage:
      additionalProperties: false
      properties:
        backend:
          $ref: "#/components/schemas/LibraryBackend"
        limit_bytes:
          description: A null value means no limit.
          format: int64
          type:
            - integer
            - "null"
        used_bytes:
          description: Stored bytes of all file versions and trashed files, plus bytes of unfinished uploads.
          format: int64
          type: integer
      required:
        - backend
        - used_bytes
        - limit_bytes
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
      type: object
    VersionOutputBody:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
  securitySchemes:
    session:
      in: cookie
      name: stocat_session
      type: apiKey
info:
  title: stocat
  version: 0.0.1
openapi: 3.1.0
paths:
  /api/v1/activity:
    get:
      operationId: activity-list
      parameters:
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int32
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
