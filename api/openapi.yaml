components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - email
        - password
      type: object
    ProbeOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    Problem:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        request_id:
          description: Identifier of the request. Give this value to support.
          examples:
            - MJQXE43UNFWWK
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        password:
          description: Use at least 15 characters and at most 1024 bytes.
          type: string
          writeOnly: true
      required:
        - name
        - email
        - password
      type: object
    Session:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        current:
          description: The request uses this session.
          type: boolean
        id:
          type: string
        ip_address:
          type:
            - string
            - "null"
        user_agent:
          type: string
      required:
        - id
        - user_agent
        - ip_address
        - created_at
        - current
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
      type: object
  securitySchemes:
    session:
      in: cookie
      name: stocat_session
      type: apiKey
info:
  title: stocat
  version: 0.0.1
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Sign in
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: auth-logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Revoke the current session
      tags:
        - Auth
  /auth/me:
    get:
      operationId: auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - session: []
      summary: Get the current user
      tags:
        - Auth
  /auth/register:
    post:
      operationId: auth-register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
          headers:
            Set-Cookie:
              schema:
                type: string
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Create an account and sign in
      tags:
        - Auth
  /auth/sessions:
    delete:
      operationId: auth-sessions-revoke-others
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - session: []
      summary: Revoke all sessions except the current session
      tags:
        - Auth
    get:
      operationId: auth-sessions-list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - session: []
      summary: List the active sessions of the current user
      tags:
        - Auth
  /auth/sessions/{id}:
    delete:
      operationId: auth-sessions-revoke
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Clears the cookie when the request revokes its own session.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - session: []
      summary: Revoke a session
      tags:
        - Auth
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check service health
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Check service readiness
