            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - session: []
      summary: Check the connection with unsaved settings
      tags:
        - Storage
  /api/v1/admin/storage-backends/{id}:
    delete:
      operationId: storage-backends-delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
