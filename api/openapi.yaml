          $ref: "#/components/schemas/SignedRecord"
          description: Sign with the new identity's signing key.
        password_envelope:
          $ref: "#/components/schemas/SignedRecord"
        private_envelope:
          $ref: "#/components/schemas/SignedRecord"
        recovery_envelope:
          $ref: "#/components/schemas/SignedRecord"
      required:
        - identity
        - continuity
        - password_envelope
        - recovery_envelope
        - private_envelope
      type: object
    S3Config:
      additionalProperties: false
      properties:
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    S3Input:
      additionalProperties: false
      properties:
        access_key_id:
          description: Required when you create a backend. On update, leave both credentials empty to keep the stored credentials.
          maxLength: 256
          type: string
          writeOnly: true
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
        secret_access_key:
          maxLength: 256
          type: string
          writeOnly: true
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    Session:
      additionalProperties: false
      properties:
