components:
  schemas:
    AdminUser:
      additionalProperties: false
      properties:
        default_quota_mb:
          description: Default quota in megabytes. A null value means no limit.
          format: int64
          type:
            - integer
            - "null"
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        libraries:
          items:
            $ref: "#/components/schemas/LibraryQuota"
          type: array
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
        - default_quota_mb
        - libraries
      type: object
    Backend:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        id:
          examples:
            - stb_01K4W9T5V8QK3M7ZB0YHXC2FNE
          type: string
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Present only for local backends.
        name:
          type: string
        s3:
          $ref: "#/components/schemas/S3Config"
          description: Present only for S3 backends. It never contains credentials.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - id
        - name
        - type
        - enabled
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          description: Use at least 15 characters and at most 1024 bytes.
          type: string
          writeOnly: true
      required:
        - current_password
        - new_password
      type: object
    CheckSettingsInputBody:
      additionalProperties: false
      properties:
        id:
          description: ID of a saved backend. Empty S3 credentials use the stored credentials of this backend, if the endpoint does not change.
          maxLength: 64
          type: string
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - type
      type: object
    ConnectionCheck:
      additionalProperties: false
      properties:
        message:
          description: Result of the check. It never contains credentials.
          type: string
        ok:
          type: boolean
      required:
        - ok
        - message
      type: object
    CreateBackendInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        name:
          maxLength: 100
          minLength: 1
          type: string
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - name
        - type
        - enabled
      type: object
    CreateLibraryInputBody:
      additionalProperties: false
      properties:
        backend_id:
          maxLength: 64
          minLength: 1
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        key_envelope:
          contentEncoding: base64
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - backend_id
        - encryption_mode
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FolderInputBody:
      additionalProperties: false
      properties:
        encrypted_name:
          contentEncoding: base64
          type: string
        name:
          maxLength: 255
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          maxLength: 64
          type: string
      type: object
    Library:
      additionalProperties: false
      properties:
        backend:
          $ref: "#/components/schemas/LibraryBackend"
        created_at:
          format: date-time
          type: string
        encryption_mode:
          enum:
            - none
            - e2ee
          type: string
        id:
          type: string
        key_envelope:
          contentEncoding: base64
          type: string
        name:
          type: string
        quota_mb:
          description: Quota override in megabytes. A null value uses the user default quota.
          format: int64
          type:
            - integer
            - "null"
        root_node_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - encryption_mode
        - root_node_id
        - backend
        - quota_mb
        - created_at
        - updated_at
      type: object
    LibraryBackend:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          enum:
            - local
            - s3
          type: string
      required:
        - id
        - name
        - type
      type: object
    LibraryQuota:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        quota_mb:
          description: Quota in megabytes. A null value uses the user default quota.
          format: int64
          type:
            - integer
            - "null"
      required:
        - id
        - name
        - quota_mb
      type: object
    LocalConfig:
      additionalProperties: false
      properties:
        root:
          description: Absolute path of the directory that stores objects.
          examples:
            - /var/lib/stocat/objects
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - root
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - email
        - password
      type: object
    Node:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        encrypted_name:
          contentEncoding: base64
          type: string
        id:
          type: string
        kind:
          enum:
            - file
            - folder
          type: string
        library_id:
          type: string
        name:
          type: string
        name_token:
          contentEncoding: base64
          type: string
        parent_id:
          type: string
        revision:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - library_id
        - kind
        - revision
        - created_at
        - updated_at
      type: object
    NodesPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Node"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ProbeOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    Problem:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        request_id:
          description: Identifier of the request. Give this value to support.
          examples:
            - MJQXE43UNFWWK
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        password:
          description: Use at least 15 characters and at most 1024 bytes.
          type: string
          writeOnly: true
      required:
        - name
        - email
        - password
      type: object
    S3Config:
      additionalProperties: false
      properties:
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    S3Input:
      additionalProperties: false
      properties:
        access_key_id:
          description: Required when you create a backend. On update, leave both credentials empty to keep the stored credentials.
          maxLength: 256
          type: string
          writeOnly: true
        bucket:
          examples:
            - stocat
          maxLength: 63
          minLength: 3
          type: string
        endpoint:
          description: Base URL of an S3-compatible service. Use an empty value for AWS.
          examples:
            - https://s3.eu-central-1.amazonaws.com
          maxLength: 2048
          type: string
        force_path_style:
          description: Put the bucket name in the URL path instead of the host name. RustFS needs this.
          type: boolean
        prefix:
          description: Key prefix of all objects. Use an empty value for the bucket root.
          examples:
            - objects
          maxLength: 512
          type: string
        region:
          examples:
            - eu-central-1
          maxLength: 64
          minLength: 1
          type: string
        secret_access_key:
          maxLength: 256
          type: string
          writeOnly: true
      required:
        - endpoint
        - region
        - bucket
        - prefix
        - force_path_style
      type: object
    Session:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        current:
          description: The request uses this session.
          type: boolean
        id:
          type: string
        ip_address:
          type:
            - string
            - "null"
        user_agent:
          type: string
      required:
        - id
        - user_agent
        - ip_address
        - created_at
        - current
      type: object
    UpdateAccountInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - email
      type: object
    UpdateBackendInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        local:
          $ref: "#/components/schemas/LocalConfig"
          description: Required for local backends.
        name:
          maxLength: 100
          minLength: 1
          type: string
        s3:
          $ref: "#/components/schemas/S3Input"
          description: Required for S3 backends.
      required:
        - name
        - enabled
      type: object
    UpdateLibraryQuotaInputBody:
      additionalProperties: false
      properties:
        quota_mb:
          description: Quota in megabytes. Send null to use the user default quota.
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - quota_mb
      type: object
    UpdateUserQuotaInputBody:
      additionalProperties: false
      properties:
        default_quota_mb:
          description: Default quota in megabytes. Send null for no limit.
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - default_quota_mb
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - email
        - is_admin
      type: object
  securitySchemes:
    session:
      in: cookie
      name: stocat_session
      type: apiKey
info:
  title: stocat
  version: 0.0.1
openapi: 3.1.0
paths:
  /api/v1/admin/libraries/{id}/quota:
    put:
      operationId: admin-libraries-quota-set
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryQuotaInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryQuota"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - session: []
      summary: Set the quota override of a library
      tags:
        - Admin
  /api/v1/admin/storage-backends:
    get:
      operationId: storage-backends-list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Backend"
                type: array
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - session: []
      summary: List storage backends
      tags:
        - Storage
    post:
      operationId: storage-backends-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackendInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backend"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds before the next attempt.
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - session: []
      summary: Create a storage backend
      tags:
        - Storage
  /api/v1/admin/storage-backends/check:
    post:
      description: The server writes, reads, and deletes a small object. A completed check returns status 200. The ok field contains the result.
      operationId: storage-backends-check-settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckSettingsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionCheck"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
